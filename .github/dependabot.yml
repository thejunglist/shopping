version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      # The WebAssembly file must match the code that loads it, so these two
      # are always updated in the same pull request.
      barcode-reader:
        patterns: ['barcode-detector', 'zxing-wasm']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
